name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: pip install -e ".[dev,spark]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -p no:warnings

  backtest:
    # Forecast quality gate: fails if the best model stops beating seasonal-naive.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Rolling backtest
        run: |
          skyyield backtest --folds 4 --out backtest.csv
          python scripts/check_backtest.py backtest.csv
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: backtest.csv

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t skyyield-api .
      - name: Smoke test
        run: |
          docker run -d -p 7860:7860 --name api skyyield-api
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/forecast/DXB-JFK?horizon=3
