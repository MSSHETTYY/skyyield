[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cargokit"
version = "0.1.0"
description = "Air cargo demand forecasting, lane economics and capacity optimization toolkit (SkyYield)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "manee" }]
keywords = ["air cargo", "forecasting", "revenue management", "operations research", "ab testing"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "ortools>=9.10",
  "scipy>=1.11",
  "pyarrow>=15",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
deep = ["tensorflow>=2.16"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.6"]

[project.scripts]
skyyield = "cargokit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cargokit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Frozen dataclass defaults are immutable (B008); zip lengths are equal by construction (B905).
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["spark: needs a local Spark session (Java required)"]
